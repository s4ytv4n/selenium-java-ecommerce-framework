name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # daily run catches regressions on the live demo store
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite (testng = full regression, smoke = smoke only)'
        default: testng
        type: choice
        options: [testng, smoke]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests (headless Chrome)
        run: mvn -B -ntp test -Dsuite=${{ inputs.suite || 'testng' }} -Dheadless=true -Dbrowser=chrome

      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: mvn -B -ntp allure:report

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 14

      - name: Prepare report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/allure-maven-plugin/

  publish-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
